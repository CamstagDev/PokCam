# Al subir una etiqueta vX.Y.Z (ver scripts/nueva-version.mjs), compila el
# instalador de Windows y el APK de Android y los publica en una Release
# de GitHub, con las notas de esa versión sacadas de CHANGELOG.md.
# También se puede lanzar a mano (workflow_dispatch) con la versión, por
# ejemplo v0.2.0: se publica desde la rama elegida y la Release crea la
# etiqueta si no existe.
name: Publicar versión

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (vX.Y.Z)'
        required: true

env:
  ETIQUETA: ${{ inputs.version || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Electron descarga su programa la primera vez que se usa;
      # electron-builder lo toma de node_modules/electron/dist.
      - run: npx electron --version
      - run: npm run instalador:windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*.exe

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
      # El APK de prueba se firma con la clave de depuración del PC de
      # Camstag (secreto ANDROID_KEYSTORE_BASE64), para que
      # instale encima de la app ya instalada sin borrar las partidas. Sin
      # el secreto, Gradle crea una clave nueva.
      - name: Clave de firma
        env:
          CLAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CLAVE" ]; then
            mkdir -p ~/.android
            echo "$CLAVE" | base64 -d > ~/.android/debug.keystore
          fi
      # APK de prueba (sin firma de Google Play; eso llega con el paso de
      # publicar en la tienda).
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk "PokCam-${ETIQUETA}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: PokCam-*.apk

  publicar:
    needs: [windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: archivos
          merge-multiple: true
      # Las notas de la Release son la entrada de esta versión en DEVLOG.md
      # (si la hay) y debajo su sección de CHANGELOG.md.
      - name: Notas de la versión
        run: |
          version="${ETIQUETA#v}"
          seccion() { awk -v v="## $version " 'index($0, v) == 1 { dentro = 1; next } /^## / { dentro = 0 } dentro' "$1"; }
          devlog="$(seccion DEVLOG.md)"
          {
            if [ -n "$devlog" ]; then
              echo "$devlog"
              echo
              echo "## Cambios"
            fi
            seccion CHANGELOG.md
          } > notas.md
          cat notas.md
      - uses: softprops/action-gh-release@v3
        with:
          name: PokCam ${{ env.ETIQUETA }}
          tag_name: ${{ env.ETIQUETA }}
          target_commitish: ${{ github.sha }}
          body_path: notas.md
          files: archivos/*
